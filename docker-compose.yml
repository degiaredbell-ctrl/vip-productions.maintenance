services:
  app:
    build: .
    image: vip-maintenance-app
    container_name: vip_app
    restart: unless-stopped
    env_file: .env
    volumes:
      - app_public:/var/www/html/public
      - ./storage:/var/www/html/storage
    networks:
      - vipnet

  # Pekerja antrean: mengirim email notifikasi (Settings → Integrate) di latar
  # belakang supaya tanda tangan/approval tidak menunggu server email.
  queue:
    image: vip-maintenance-app
    pull_policy: never
    container_name: vip_queue
    restart: unless-stopped
    env_file: .env
    user: www-data
    entrypoint: ["php", "artisan"]
    command: ["queue:work", "--tries=3", "--backoff=30", "--sleep=3", "--max-time=3600"]
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      - app
    networks:
      - vipnet

  # Penjadwal: laporan PM otomatis (Integrate) dan backup database harian.
  scheduler:
    image: vip-maintenance-app
    pull_policy: never
    container_name: vip_scheduler
    restart: unless-stopped
    env_file: .env
    user: www-data
    entrypoint: ["php", "artisan"]
    command: ["schedule:work"]
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      - app
    networks:
      - vipnet

  nginx:
    image: nginx:1.27-alpine
    container_name: vip_nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - app_public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - vipnet

volumes:
  app_public:

networks:
  vipnet:
